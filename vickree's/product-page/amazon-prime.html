<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="product.css">
    </head>
<body>
    <div class="product">
     <img src="../amzon-prime tv.jpg">
     <div class="div">
       <h1>AMAZON PRIME VIDEO SUBSCRIPTION</h1>
       <p>Watch the latest movies, TV shows, and Amazon Originals anytime.</p>
       <p>6-Month Subscription</p>
       <p><strong>$9</strong></p>
       <form id="form" class="form">
       <input type="email" placeholder="Enter Email-Address" required>
       <input type="number" placeholder="Input Card-Number" required>
       <div id="flex">
       <input type="date" required>
       <input type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="CCV" required>
       </div>
       <button id="order"  type="submit" style="position: relative; left: 110px;">ORDER</button>
       </form>
     </div>
    </div>
    <div id="check" class="check">
       <div class="tick">
         <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
           <path d="M20 6L9 17L4 12" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
         </svg>
        </div>
        <p style="font-size: 20px; color: #2ecc71; transition: 10s;">Order Confirmed!</p>
        <p>&ensp;Thank you! Your order of $9 has &ensp;&ensp;&ensp;&ensp;&ensp; been successfully placed</p>
    </div>
</body>
<script src="product.js"></script>
</html>
